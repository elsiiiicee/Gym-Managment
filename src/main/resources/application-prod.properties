# Production profile overrides. Activated via SPRING_PROFILES_ACTIVE=prod.
#
# Schema is owned by Flyway in production. Hibernate is restricted to
# validating that the live schema matches the entity model; it must not
# alter or create tables. Any drift fails fast at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate lets Flyway adopt a pre-existing schema. Pair it with
# baseline-version=0 so that on an *empty* database Flyway still applies V1
# from scratch instead of baselining at the highest available version.
# (Without baseline-version=0, an empty DB gets baselined at V1 and Flyway
# then jumps straight to V2, which fails because V1's tables never ran.)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Production must use the Postgres dialect. Datasource URL/credentials are
# expected to come from environment variables / Docker secrets / CI secrets
# (see application.properties for the variable names).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Verbose SQL is off in prod by default; flip via env var for incident debugging.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Open-in-view stays off (already set in application.properties).
spring.jpa.open-in-view=false

# Actuator: never expose component health details to anonymous callers in prod
# (leaks DB/disk/dependency status — useful recon for attackers). Liveness and
# readiness probes still return plain UP/DOWN.
management.endpoint.health.show-details=never

# Behind a load balancer / reverse proxy, trust forwarded headers so the app
# sees the real client scheme and IP (used by the rate limiter and for correct
# https URL generation). Only enable when actually fronted by a trusted proxy.
server.forward-headers-strategy=framework

# HikariCP defaults — tune via env if needed.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
