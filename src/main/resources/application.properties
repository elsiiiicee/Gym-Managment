spring.application.name=legion

# Expose actuator endpoints for local health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Datasource configuration:
# - By default the app uses an in-memory H2 database (for tests and local dev).
# - To use Supabase (Postgres), set the `SPRING_DATASOURCE_URL` environment variable
#   to a JDBC URL (e.g. `jdbc:postgresql://HOST:5432/DBNAME?sslmode=require`) and
#   set `SPRING_DATASOURCE_USERNAME` and `SPRING_DATASOURCE_PASSWORD` appropriately.
# The configuration below falls back to H2 when those env vars are not provided.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:legiondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# The H2 web console is never enabled — it is an RCE/SSRF attack surface and
# the console starter has been removed from the build. Kept explicit as
# defense-in-depth in case a transitive dependency reintroduces it.
spring.h2.console.enabled=false

# Let Spring Boot detect the driver automatically (Postgres driver is on the classpath).

# JPA settings (override via env vars if needed)
# Default to ddl-auto=update for dev convenience (H2 in-memory). Production
# MUST run with the `prod` profile which sets ddl-auto=validate and enables
# Flyway-managed schema migrations (see application-prod.properties).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${SPRING_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
# Force lazy-association access inside an explicit transaction. Without this,
# request-scoped Hibernate sessions silently keep lazy references alive past
# the controller boundary and hide bugs; we want them surfaced.
spring.jpa.open-in-view=false

# Flyway: disabled by default so dev/H2 keeps the existing auto-schema path.
# Production overrides via the `prod` profile.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

# Supabase (client) public values (useful for any frontend components)
supabase.url=${NEXT_PUBLIC_SUPABASE_URL:}
supabase.publishable-key=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:}

# Security configuration
app.security.jwt-secret=${APP_JWT_SECRET}
app.security.access-token-minutes=${APP_ACCESS_TOKEN_MINUTES:30}
app.security.refresh-token-days=${APP_REFRESH_TOKEN_DAYS:14}
