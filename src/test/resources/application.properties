logging.level.root=WARN
logging.level.com.unyt.legion=INFO
spring.main.banner-mode=off
spring.jpa.open-in-view=false
debug=false
app.security.jwt-secret=test-only-jwt-secret-for-legion-tests

# Test-only: relax rate limits so the integration suite does not trip the
# production-grade per-IP limiter. Production values stay at filter defaults.
app.rate-limit.auth-max=100000
app.rate-limit.auth-window-seconds=1
app.rate-limit.api-max=100000
app.rate-limit.api-window-seconds=1
